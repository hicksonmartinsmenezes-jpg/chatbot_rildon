
services:

  app:
    build: .
    container_name: chatbot_rildon_app

    restart: always

    ports:
      - "3000:3000"

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      - postgres

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16

    container_name: chatbot_rildon_postgres

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
