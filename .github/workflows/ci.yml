name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint de sintaxe + testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instala dependências (reprodutível)
        run: npm ci

      - name: Verificação de sintaxe
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Testes (Jest)
        run: npm test
