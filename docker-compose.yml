
services:

  app:
    build: .
    container_name: chatbot_rildon_app

    restart: always

    ports:
      - "3000:3000"

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

  # Catálogo da loja em contêiner próprio (programa Windows "Catálogo Rildon"): sem WhatsApp, então
  # o que acontece no atendimento não deixa o catálogo lento. Mesmo código, mesmas pastas e mesmo banco.
  catalogo:
    # Mesma imagem do painel (o código vem do volume .:/app, então não precisa construir de novo).
    image: chatbot_rildon-app
    container_name: chatbot_rildon_catalogo
    command: ["node", "src/catalogo-server.js"]

    restart: always

    ports:
      - "3001:3001"

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      CATALOGO_PROCESSO: catalogo
      CATALOGO_PORT: 3001

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16

    container_name: chatbot_rildon_postgres

    restart: always

    # Só acessível pela própria máquina (varredura 2026-09-30): antes ficava
    # aberto para toda a rede local. O app fala com o banco pela rede interna
    # do Docker (DB_HOST=postgres), então não precisa desta porta na LAN.
    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
