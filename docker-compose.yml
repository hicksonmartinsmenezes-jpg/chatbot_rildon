
services:

  app:
    build: .
    container_name: chatbot_rildon_app

    restart: always

    ports:
      - "3000:3000"

    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

  # O Catálogo (programa Windows "Catálogo Rildon") virou serviço/repositório
  # próprio em 2026-11-03 — ver catalogo-rildon. A orquestração de produção
  # dos dois junto com este banco fica no repositório rildon-infra; este
  # docker-compose.yml aqui cobre só o painel de atendimento isolado.
  postgres:
    image: postgres:16

    container_name: chatbot_rildon_postgres

    restart: always

    # Só acessível pela própria máquina (varredura 2026-09-30): antes ficava
    # aberto para toda a rede local. O app fala com o banco pela rede interna
    # do Docker (DB_HOST=postgres), então não precisa desta porta na LAN.
    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
