<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Cards</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/09-dashboard.css?v=3">
  <style>
    body { background: #0b0f1a; padding: 40px; font-family: 'Nunito', sans-serif; }
  </style>
</head>
<body>
  <section class="executive-cards">
    <article class="executive-card primary">
      <div class="executive-card-icon"><i class="fa-solid fa-headset"></i></div>
      <strong>12</strong>
      <div class="executive-card-label"><span>Total de atendimentos</span><i class="fa-solid fa-circle-info"></i></div>
    </article>
    <article class="executive-card warning">
      <div class="executive-card-icon"><i class="fa-solid fa-inbox"></i></div>
      <strong>8</strong>
      <div class="executive-card-label"><span>Abertos</span><i class="fa-solid fa-circle-info"></i></div>
    </article>
    <article class="executive-card info">
      <div class="executive-card-icon"><i class="fa-solid fa-comments"></i></div>
      <strong>0</strong>
      <div class="executive-card-label"><span>Em andamento</span><i class="fa-solid fa-circle-info"></i></div>
    </article>
    <article class="executive-card danger">
      <div class="executive-card-icon"><i class="fa-solid fa-circle-check"></i></div>
      <strong>8</strong>
      <div class="executive-card-label"><span>Pendentes</span><i class="fa-solid fa-circle-info"></i></div>
    </article>
  </section>
</body>
</html>
