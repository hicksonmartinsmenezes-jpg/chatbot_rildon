<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Catálogo Rildon</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:; frame-src blob:; connect-src http: https:">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f3f5f8;color:#0b2a5b;min-height:100vh}
.aviso{background:#fff4d6;border-bottom:1px solid #e6c25a;color:#5c4400;font-size:13px;padding:8px 16px;text-align:center}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;min-height:calc(100vh - 36px);background:linear-gradient(180deg,#fff 0%,#eaf0f8 100%)}
#home img{width:min(300px,55vw)}
.caixas{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.caixa{width:170px;height:170px;border:0;background:#0b2a5b;color:#fff;font:inherit;font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
.caixa svg{width:44px;height:44px;fill:#fff}
.caixa.off{background:#8a94a6}
.msg{min-height:22px;font-size:14px;color:#b00020;font-weight:600;text-align:center;max-width:460px}
#lista,#viewer{display:none;padding:16px}
.topo{display:flex;gap:10px;margin-bottom:14px}
.btn{height:40px;padding:0 18px;border:1px solid #0b2a5b;background:#fff;color:#0b2a5b;font:inherit;font-weight:700;cursor:pointer}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:130px;background:#fff;border:1px solid #c3cad6;color:#0b2a5b;font:inherit;font-size:14px;font-weight:700;text-align:center;padding:16px 10px;cursor:pointer}
.card:hover{border-color:#0b2a5b;box-shadow:0 4px 14px rgba(11,42,91,.18)}
.card img{width:100%;max-width:150px;height:64px;object-fit:contain}
.card .ic{font-size:13px;color:#006fa0;height:64px;display:flex;align-items:center}
iframe{width:100%;height:calc(100vh - 120px);border:1px solid #c3cad6;background:#fff}
.vazio{font-size:15px;color:#374151;padding:24px 0}
</style></head><body>
<div class="aviso" id="aviso">Sem conexão com o servidor da loja. O programa reconecta sozinho assim que o servidor voltar.</div>

<div id="home">
  <img src="logo-rildon.png" alt="Rildon Eletro Peças">
  <div class="caixas">
    <button class="caixa off" id="b-consultar"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12" fill="none" stroke="#fff" stroke-width="5"/><path d="M29 29l13 13" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>Consultar</button>
    <button class="caixa" id="b-catalogos"><svg viewBox="0 0 48 48"><path d="M4 8h16c2 0 4 2 4 4v28c0-2-2-4-4-4H4z M44 8H28c-2 0-4 2-4 4v28c0-2 2-4 4-4h16z"/></svg>Ver Catálogos</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div id="lista">
  <div class="topo"><button class="btn" id="v-home">← Início</button></div>
  <div class="grade" id="grade"></div>
  <div class="vazio" id="vazio" style="display:none">Nenhum catálogo foi salvo neste computador ainda. Com o servidor ligado, abra "Ver Catálogos" e use "Salvar todos para uso offline".</div>
</div>

<div id="viewer">
  <div class="topo"><button class="btn" id="v-lista">← Voltar aos catálogos</button></div>
  <iframe id="pdf" title="Catálogo"></iframe>
</div>

<script>
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const api = window.catalogoLoja;
let urlAtual = null;
function tela(n) { ["home","lista","viewer"].forEach((t) => { $(t).style.display = t === n ? (t === "home" ? "flex" : "block") : "none"; }); }

$("b-consultar").onclick = () => {
  $("msg").textContent = "Consultar precisa do servidor da loja. Confira o cabo de rede; o programa reconecta sozinho.";
};
$("b-catalogos").onclick = async () => {
  tela("lista");
  const l = (await api.catalogoLocalListar()) || [];
  $("vazio").style.display = l.length ? "none" : "block";
  const g = $("grade"); g.innerHTML = "";
  l.forEach((c) => {
    const b = document.createElement("button"); b.className = "card";
    const nome = c.nome.replace(/-[0-9a-f]{6}$/, "").toUpperCase();
    const base = String(c.chave || c.id.replace(/-[0-9a-f]{6}$/, "")).split("::")[0].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const img = document.createElement("img"); img.src = "logos-marcas/" + base + ".png"; img.alt = "";
    img.onerror = () => { const s = document.createElement("div"); s.className = "ic"; s.textContent = "PDF"; img.replaceWith(s); };
    const sp = document.createElement("span"); sp.textContent = nome;
    b.append(img, sp);
    b.onclick = async () => {
      const r = await api.catalogoLocalLerPorId(c.id);
      if (!r) return;
      if (urlAtual) URL.revokeObjectURL(urlAtual);
      urlAtual = URL.createObjectURL(new Blob([r], { type: "application/pdf" }));
      $("pdf").src = urlAtual + "#navpanes=0&view=Fit";
      tela("viewer");
    };
    g.appendChild(b);
  });
};
$("v-home").onclick = () => tela("home");
$("v-lista").onclick = () => { $("pdf").src = "about:blank"; tela("lista"); };

// Volta sozinho assim que o servidor responder.
const alvo = (q.get("url") || "").replace(/\/+$/, "");
let tentando = false;
setInterval(async () => {
  if (tentando || !alvo) return;
  tentando = true;
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 2500);
    await fetch(alvo + "/", { mode: "no-cors", cache: "no-store", signal: c.signal });
    api.recarregar();
  } catch (_) {}
  tentando = false;
}, 3000);
</script></body></html>
